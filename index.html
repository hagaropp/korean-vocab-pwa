<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>한국어 Vocab — Korean Flashcards</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4F46E5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="한국어 Vocab" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon-192.png" />

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg: #ffffff;
      --bg-elevated: #F0F0F3;
      --bg-selected: #E0E1E6;
      --text: #000000;
      --text2: #60646C;
      --accent: #4F46E5;
      --green: #34C759;
      --green-tint: #34C75930;
      --red: #FF3B30;
      --red-tint: #FF3B3030;
      --safe-top: env(safe-area-inset-top);
      --safe-bot: env(safe-area-inset-bottom);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --bg-elevated: #212225;
        --bg-selected: #2E3135;
        --text: #ffffff;
        --text2: #B0B4BA;
        --accent: #818CF8;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }
    button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }

    #root { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

    .main {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: calc(20px + var(--safe-top)) 20px calc(96px + var(--safe-bot));
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
    }

    h1.page-title { font-size: 40px; font-weight: 800; line-height: 1.1; margin-bottom: 4px; }
    p.page-subtitle { color: var(--text2); font-size: 15px; margin-bottom: 20px; }

    .lesson-list { display: flex; flex-direction: column; gap: 8px; }
    .lesson-row {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--bg-elevated); border-radius: 16px; padding: 16px;
      border: none; text-align: left; width: 100%;
    }
    .lesson-row .lesson-title { font-size: 16px; font-weight: 500; }
    .lesson-row .lesson-count { font-size: 14px; color: var(--text2); }
    .lesson-row-mixed {
      background: var(--accent); margin-bottom: 8px;
    }
    .lesson-row-mixed .lesson-title, .lesson-row-mixed .lesson-count { color: #ffffff; }
    .lesson-row-mixed .lesson-title { font-weight: 700; }

    .back-link { color: var(--text2); font-size: 14px; background: none; border: none; padding: 4px 0; margin-bottom: 12px; }
    .row-between { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .progress-label { font-size: 14px; color: var(--text2); }

    /* Flashcard */
    .card-scene { perspective: 1200px; height: 320px; margin-bottom: 16px; }
    .card-flip {
      position: relative; width: 100%; height: 100%;
      transform-style: preserve-3d; transition: transform 0.35s ease;
    }
    .card-flip.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute; inset: 0; backface-visibility: hidden;
      background: var(--bg-elevated); border-radius: 24px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; padding: 20px; text-align: center;
    }
    .card-back-face { transform: rotateY(180deg); }
    .card-korean { font-size: 40px; font-weight: 700; }
    .card-romanization { font-size: 16px; color: var(--text2); }
    .card-english { font-size: 28px; font-weight: 700; }
    .card-hint { text-align: center; color: var(--text2); font-size: 14px; margin-bottom: 16px; }

    .action-row { display: flex; gap: 12px; }
    .btn { border: none; border-radius: 16px; padding: 16px; font-size: 16px; font-weight: 600; flex: 1; text-align: center; }
    .btn-red { background: var(--red); color: #fff; }
    .btn-green { background: var(--green); color: #fff; }
    .btn-dark { background: var(--text); color: var(--bg); }
    .btn-block { width: 100%; margin-top: 16px; }

    .center-text { text-align: center; }
    .result-title { font-size: 32px; font-weight: 800; margin-bottom: 8px; }
    .result-body { font-size: 16px; color: var(--text2); margin-bottom: 24px; }
    .result-back { text-align: center; margin-top: 16px; color: var(--text2); background: none; border: none; font-size: 15px; }

    /* Quiz */
    .quiz-prompt {
      background: var(--bg-elevated); border-radius: 24px; padding: 40px 20px;
      display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 16px;
    }
    .quiz-options { display: flex; flex-direction: column; gap: 8px; }
    .quiz-option {
      background: var(--bg-elevated); border: none; border-radius: 16px; padding: 16px;
      text-align: left; font-size: 16px;
    }
    .quiz-option.correct { background: var(--green); color: #fff; }
    .quiz-option.wrong { background: var(--red); color: #fff; }

    /* Games menu */
    .game-card { background: var(--bg-elevated); border: none; border-radius: 24px; padding: 24px; text-align: left; width: 100%; margin-top: 8px; }
    .game-card-title { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .game-card-sub { color: var(--text2); font-size: 14px; }

    /* Match */
    .match-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .match-tile {
      width: calc((100% - 16px) / 3); aspect-ratio: 1.1;
      background: var(--bg-elevated); border: none; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; text-align: center;
      padding: 6px; font-size: 14px;
    }
    .match-tile.selected { background: var(--bg-selected); }
    .match-tile.matched { background: var(--green-tint); }
    .match-tile.wrong { background: var(--red-tint); }
    .match-tile:disabled { opacity: 1; }

    /* Drive Mode */
    .option-group { margin-bottom: 16px; }
    .option-group-label { font-size: 14px; font-weight: 600; color: var(--text2); margin-bottom: 8px; }
    .option-btn {
      display: block; width: 100%; background: var(--bg-elevated); border: 2px solid transparent;
      border-radius: 16px; padding: 14px 16px; text-align: left; font-size: 16px; margin-bottom: 8px;
    }
    .option-btn.selected { border-color: var(--accent); background: var(--bg-selected); font-weight: 600; }

    .drive-screen { display: flex; flex-direction: column; align-items: center; min-height: 55vh; justify-content: center; gap: 20px; }
    .drive-phase { font-size: 13px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.6px; }
    .drive-word { font-size: 52px; font-weight: 800; text-align: center; word-break: break-word; }
    .drive-sub { font-size: 18px; color: var(--text2); text-align: center; }
    .drive-controls { display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 12px; }
    .drive-play-btn {
      width: 84px; height: 84px; border-radius: 50%; background: var(--accent); color: #fff;
      border: none; font-size: 30px; display: flex; align-items: center; justify-content: center;
    }
    .drive-skip-btn {
      width: 60px; height: 60px; border-radius: 50%; background: var(--bg-elevated); color: var(--text);
      border: none; font-size: 22px; display: flex; align-items: center; justify-content: center;
    }

    /* Tab bar */
    .tab-bar-wrap {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: flex; justify-content: center;
      padding: 12px 16px calc(12px + var(--safe-bot));
      pointer-events: none;
    }
    .tab-bar {
      pointer-events: auto;
      background: var(--bg-elevated); border-radius: 999px;
      padding: 8px 20px; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      max-width: 640px; width: 100%;
    }
    .tab-brand { font-weight: 700; font-size: 14px; margin-right: auto; }
    .tab-btn { background: transparent; border: none; padding: 6px 14px; border-radius: 12px; font-size: 14px; color: var(--text2); }
    .tab-btn.active { background: var(--bg-selected); color: var(--text); }

    .loading { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text2); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function speak(text, lang, rate) {
      return new Promise((resolve) => {
        if (!("speechSynthesis" in window)) { resolve(); return; }
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = lang;
        utter.rate = rate || 0.9;
        utter.onend = resolve;
        utter.onerror = resolve;
        window.speechSynthesis.speak(utter);
      });
    }

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function shuffle(items) {
      const result = [...items];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function LessonList({ lessons, onSelect }) {
      return (
        <div className="lesson-list">
          {lessons.map((lesson) => (
            <button
              key={lesson.id}
              className={"lesson-row" + (lesson.mixed ? " lesson-row-mixed" : "")}
              onClick={() => onSelect(lesson)}>
              <span className="lesson-title">{lesson.title}</span>
              <span className="lesson-count">{lesson.words.length} words</span>
            </button>
          ))}
        </div>
      );
    }

    function withMixedLesson(lessons, allWords) {
      return [
        { id: "all", title: "🔀 All Words Mixed", words: allWords, mixed: true },
        ...lessons,
      ];
    }

    function FlashcardDeck({ lesson, onExit }) {
      const [order, setOrder] = useState(() => shuffle(lesson.words.map((_, i) => i)));
      const [index, setIndex] = useState(0);
      const [flipped, setFlipped] = useState(false);
      const [knownCount, setKnownCount] = useState(0);

      const isDone = index >= order.length;
      const word = !isDone ? lesson.words[order[index]] : null;

      function advance(known) {
        if (known) setKnownCount((c) => c + 1);
        setFlipped(false);
        setIndex((i) => i + 1);
      }

      function restart() {
        setOrder(shuffle(lesson.words.map((_, i) => i)));
        setIndex(0);
        setKnownCount(0);
        setFlipped(false);
      }

      if (isDone) {
        return (
          <div>
            <div className="center-text">
              <div className="result-title">Nice work!</div>
              <div className="result-body">You knew {knownCount} of {order.length} words in {lesson.title}.</div>
            </div>
            <button className="btn btn-dark btn-block" onClick={restart}>Study again</button>
            <button className="result-back" onClick={onExit}>Back to lessons</button>
          </div>
        );
      }

      return (
        <div>
          <div className="row-between">
            <button className="back-link" onClick={onExit}>‹ Lessons</button>
            <span className="progress-label">{index + 1} / {order.length}</span>
          </div>

          <div className="card-scene" onClick={() => setFlipped((f) => !f)}>
            <div className={"card-flip" + (flipped ? " flipped" : "")}>
              <div className="card-face">
                <div className="card-korean">{word.korean}</div>
                <div className="card-romanization">{word.romanization}</div>
              </div>
              <div className="card-face card-back-face">
                <div className="card-english">{word.english}</div>
              </div>
            </div>
          </div>
          <div className="card-hint">Tap the card to flip</div>

          <div className="action-row">
            <button className="btn btn-red" onClick={() => advance(false)}>Still learning</button>
            <button className="btn btn-green" onClick={() => advance(true)}>Got it</button>
          </div>
        </div>
      );
    }

    function buildQuizQuestions(lesson, allWords) {
      const count = Math.min(10, lesson.words.length);
      const questionWords = shuffle(lesson.words).slice(0, count);
      return questionWords.map((word) => {
        const distractors = shuffle(allWords.filter((w) => w.english !== word.english)).slice(0, 3);
        const options = shuffle([word, ...distractors]);
        return { word, options };
      });
    }

    function QuizGame({ lesson, allWords, onExit }) {
      const [questions, setQuestions] = useState(() => buildQuizQuestions(lesson, allWords));
      const [index, setIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [picked, setPicked] = useState(null);

      const isDone = index >= questions.length;
      const current = !isDone ? questions[index] : null;

      function choose(option) {
        if (picked) return;
        setPicked(option.english);
        if (option.english === current.word.english) setScore((s) => s + 1);
      }

      function next() {
        setPicked(null);
        setIndex((i) => i + 1);
      }

      function restart() {
        setQuestions(buildQuizQuestions(lesson, allWords));
        setIndex(0);
        setScore(0);
        setPicked(null);
      }

      if (isDone) {
        return (
          <div>
            <div className="center-text">
              <div className="result-title">Quiz complete!</div>
              <div className="result-body">You scored {score} / {questions.length} on {lesson.title}.</div>
            </div>
            <button className="btn btn-dark btn-block" onClick={restart}>Play again</button>
            <button className="result-back" onClick={onExit}>Back to games</button>
          </div>
        );
      }

      return (
        <div>
          <div className="row-between">
            <button className="back-link" onClick={onExit}>‹ Games</button>
            <span className="progress-label">{index + 1} / {questions.length}</span>
          </div>

          <div className="quiz-prompt">
            <div className="card-korean">{current.word.korean}</div>
            <div className="card-romanization">{current.word.romanization}</div>
          </div>

          <div className="quiz-options">
            {current.options.map((option) => {
              const isCorrect = option.english === current.word.english;
              const isPicked = picked === option.english;
              const showResult = picked !== null;
              let cls = "quiz-option";
              if (showResult && isCorrect) cls += " correct";
              else if (showResult && isPicked) cls += " wrong";
              return (
                <button key={option.english} className={cls} disabled={showResult} onClick={() => choose(option)}>
                  {option.english}
                </button>
              );
            })}
          </div>

          {picked && <button className="btn btn-dark btn-block" onClick={next}>Next</button>}
        </div>
      );
    }

    const MAX_PAIRS = 8;

    function buildTiles(lesson) {
      const words = shuffle(lesson.words).slice(0, Math.min(MAX_PAIRS, lesson.words.length));
      const tiles = words.flatMap((word, pairId) => [
        { key: pairId + "-ko", pairId, text: word.korean, type: "ko" },
        { key: pairId + "-en", pairId, text: word.english, type: "en" },
      ]);
      return shuffle(tiles);
    }

    function MatchGame({ lesson, onExit }) {
      const [tiles, setTiles] = useState(() => buildTiles(lesson));
      const [selected, setSelected] = useState([]);
      const [wrongPair, setWrongPair] = useState([]);
      const [matchedPairIds, setMatchedPairIds] = useState(() => new Set());
      const [moves, setMoves] = useState(0);

      const pairCount = tiles.length / 2;
      const isDone = matchedPairIds.size === pairCount;

      function restart() {
        setTiles(buildTiles(lesson));
        setSelected([]);
        setWrongPair([]);
        setMatchedPairIds(new Set());
        setMoves(0);
      }

      function tapTile(i) {
        if (selected.length === 2) return;
        if (selected.includes(i)) return;
        if (matchedPairIds.has(tiles[i].pairId)) return;

        const next = [...selected, i];
        setSelected(next);

        if (next.length === 2) {
          const [a, b] = next;
          setMoves((m) => m + 1);
          if (tiles[a].pairId === tiles[b].pairId) {
            setMatchedPairIds((prev) => new Set(prev).add(tiles[a].pairId));
            setSelected([]);
          } else {
            setWrongPair(next);
            setTimeout(() => {
              setSelected([]);
              setWrongPair([]);
            }, 500);
          }
        }
      }

      if (isDone) {
        return (
          <div>
            <div className="center-text">
              <div className="result-title">All matched!</div>
              <div className="result-body">You finished {lesson.title} in {moves} moves.</div>
            </div>
            <button className="btn btn-dark btn-block" onClick={restart}>Play again</button>
            <button className="result-back" onClick={onExit}>Back to games</button>
          </div>
        );
      }

      return (
        <div>
          <div className="row-between">
            <button className="back-link" onClick={onExit}>‹ Games</button>
            <span className="progress-label">{moves} moves</span>
          </div>

          <div className="match-grid">
            {tiles.map((tile, i) => {
              const isMatched = matchedPairIds.has(tile.pairId);
              const isSelected = selected.includes(i);
              const isWrong = wrongPair.includes(i);
              let cls = "match-tile";
              if (isMatched) cls += " matched";
              else if (isWrong) cls += " wrong";
              else if (isSelected) cls += " selected";
              return (
                <button key={tile.key} className={cls} disabled={isMatched} onClick={() => tapTile(i)}>
                  {tile.text}
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    const PACE_OPTIONS = [
      { id: "short", label: "Quick (2s to answer)", ms: 2000 },
      { id: "normal", label: "Normal (3.5s to answer)", ms: 3500 },
      { id: "long", label: "Relaxed (5s to answer)", ms: 5000 },
    ];

    const DIRECTION_OPTIONS = [
      { id: "ko-en", label: "Korean → English" },
      { id: "en-ko", label: "English → Korean" },
      { id: "mixed", label: "Mixed (both directions)" },
    ];

    function DriveConfig({ lesson, onStart, onExit }) {
      const [direction, setDirection] = useState("ko-en");
      const [pace, setPace] = useState("normal");

      function start() {
        // Prime iOS speech synthesis with a near-silent utterance inside this
        // click handler, since it must run within a genuine user gesture.
        if ("speechSynthesis" in window) {
          const unlock = new SpeechSynthesisUtterance(" ");
          unlock.volume = 0.01;
          window.speechSynthesis.speak(unlock);
        }
        onStart({ direction, pace });
      }

      return (
        <div>
          <button className="back-link" onClick={onExit}>‹ Games</button>
          <h1 className="page-title">{lesson.title}</h1>
          <p className="page-subtitle">Set up Drive Mode — hands-free audio practice</p>

          <div className="option-group">
            <div className="option-group-label">Direction</div>
            {DIRECTION_OPTIONS.map((opt) => (
              <button
                key={opt.id}
                className={"option-btn" + (direction === opt.id ? " selected" : "")}
                onClick={() => setDirection(opt.id)}>
                {opt.label}
              </button>
            ))}
          </div>

          <div className="option-group">
            <div className="option-group-label">Pace</div>
            {PACE_OPTIONS.map((opt) => (
              <button
                key={opt.id}
                className={"option-btn" + (pace === opt.id ? " selected" : "")}
                onClick={() => setPace(opt.id)}>
                {opt.label}
              </button>
            ))}
          </div>

          <button className="btn btn-dark btn-block" onClick={start}>Start Drive Mode</button>
        </div>
      );
    }

    function DriveMode({ lesson, direction, pace, onExit }) {
      const [order, setOrder] = useState(() => shuffle(lesson.words.map((_, i) => i)));
      const [index, setIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(true);
      const [phase, setPhase] = useState("prompt");
      const [currentDirection, setCurrentDirection] = useState(
        direction === "mixed" ? "ko-en" : direction
      );
      const runIdRef = React.useRef(0);
      const wakeLockRef = React.useRef(null);

      const paceMs = (PACE_OPTIONS.find((p) => p.id === pace) || PACE_OPTIONS[1]).ms;

      // Keep the screen awake for the whole session so playback doesn't stall.
      useEffect(() => {
        async function acquireWakeLock() {
          try {
            if ("wakeLock" in navigator) {
              wakeLockRef.current = await navigator.wakeLock.request("screen");
            }
          } catch (e) {}
        }
        acquireWakeLock();
        function onVisibility() {
          if (document.visibilityState === "visible") acquireWakeLock();
        }
        document.addEventListener("visibilitychange", onVisibility);
        return () => {
          document.removeEventListener("visibilitychange", onVisibility);
          if (wakeLockRef.current) wakeLockRef.current.release().catch(() => {});
        };
      }, []);

      useEffect(() => {
        if (!isPlaying) {
          if ("speechSynthesis" in window) window.speechSynthesis.cancel();
          return;
        }

        if (index >= order.length) {
          setOrder(shuffle(lesson.words.map((_, i) => i)));
          setIndex(0);
          return;
        }

        const myRun = ++runIdRef.current;
        const word = lesson.words[order[index]];
        const dir = direction === "mixed" ? (Math.random() < 0.5 ? "ko-en" : "en-ko") : direction;
        setCurrentDirection(dir);

        const promptText = dir === "ko-en" ? word.korean : word.english;
        const promptLang = dir === "ko-en" ? "ko-KR" : "en-US";
        const answerText = dir === "ko-en" ? word.english : word.korean;
        const answerLang = dir === "ko-en" ? "en-US" : "ko-KR";
        const koRate = 0.85;
        const enRate = 0.95;

        async function run() {
          setPhase("prompt");
          await speak(promptText, promptLang, promptLang === "ko-KR" ? koRate : enRate);
          if (runIdRef.current !== myRun) return;
          setPhase("pause");
          await wait(paceMs);
          if (runIdRef.current !== myRun) return;
          setPhase("answer");
          await speak(answerText, answerLang, answerLang === "ko-KR" ? koRate : enRate);
          if (runIdRef.current !== myRun) return;
          await wait(700);
          if (runIdRef.current !== myRun) return;
          setIndex((i) => i + 1);
        }
        run();

        return () => {
          runIdRef.current++;
          if ("speechSynthesis" in window) window.speechSynthesis.cancel();
        };
      }, [isPlaying, index, order, direction, paceMs]);

      const currentWord = index < order.length ? lesson.words[order[index]] : null;
      const showingKorean = currentDirection === "ko-en" ? phase !== "answer" : phase === "answer";

      return (
        <div>
          <div className="row-between">
            <button className="back-link" onClick={onExit}>‹ Exit Drive Mode</button>
            <span className="progress-label">{lesson.title}</span>
          </div>

          <div className="drive-screen">
            <div className="drive-phase">
              {phase === "prompt" && "🔊 Listen"}
              {phase === "pause" && "🎤 Your turn"}
              {phase === "answer" && "✅ Answer"}
            </div>
            {currentWord && (
              <React.Fragment>
                <div className="drive-word">
                  {currentDirection === "ko-en"
                    ? (phase === "answer" ? currentWord.english : currentWord.korean)
                    : (phase === "answer" ? currentWord.korean : currentWord.english)}
                </div>
                {showingKorean && (
                  <div className="drive-sub">{currentWord.romanization}</div>
                )}
              </React.Fragment>
            )}
            <div className="drive-controls">
              <button
                className="drive-skip-btn"
                onClick={() => setIndex((i) => i + 1)}
                aria-label="Skip">
                ⏭
              </button>
              <button
                className="drive-play-btn"
                onClick={() => setIsPlaying((p) => !p)}
                aria-label={isPlaying ? "Pause" : "Play"}>
                {isPlaying ? "⏸" : "▶"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function LearnScreen({ lessons, allWords }) {
      const [activeLesson, setActiveLesson] = useState(null);
      if (activeLesson) {
        return <FlashcardDeck lesson={activeLesson} onExit={() => setActiveLesson(null)} />;
      }
      return (
        <div>
          <h1 className="page-title">Learn</h1>
          <p className="page-subtitle">Pick a lesson to start flashcards</p>
          <LessonList lessons={withMixedLesson(lessons, allWords)} onSelect={setActiveLesson} />
        </div>
      );
    }

    function GamesScreen({ lessons, allWords }) {
      const [lesson, setLesson] = useState(null);
      const [gameType, setGameType] = useState(null);
      const [driveSettings, setDriveSettings] = useState(null);

      function resetGame() {
        setGameType(null);
        setDriveSettings(null);
      }

      if (lesson && gameType === "quiz") {
        return <QuizGame lesson={lesson} allWords={allWords} onExit={resetGame} />;
      }
      if (lesson && gameType === "match") {
        return <MatchGame lesson={lesson} onExit={resetGame} />;
      }
      if (lesson && gameType === "drive" && !driveSettings) {
        return <DriveConfig lesson={lesson} onStart={setDriveSettings} onExit={resetGame} />;
      }
      if (lesson && gameType === "drive" && driveSettings) {
        return (
          <DriveMode
            lesson={lesson}
            direction={driveSettings.direction}
            pace={driveSettings.pace}
            onExit={resetGame}
          />
        );
      }
      if (lesson) {
        return (
          <div>
            <button className="back-link" onClick={() => setLesson(null)}>‹ Lessons</button>
            <h1 className="page-title">{lesson.title}</h1>
            <p className="page-subtitle">Choose a game</p>
            <button className="game-card" onClick={() => setGameType("quiz")}>
              <div className="game-card-title">Quiz</div>
              <div className="game-card-sub">Multiple choice — pick the right meaning</div>
            </button>
            <button className="game-card" onClick={() => setGameType("match")}>
              <div className="game-card-title">Match</div>
              <div className="game-card-sub">Tap pairs of Korean and English</div>
            </button>
            <button className="game-card" onClick={() => setGameType("drive")}>
              <div className="game-card-title">🚗 Drive Mode</div>
              <div className="game-card-sub">Hands-free audio practice — listen and say it out loud</div>
            </button>
          </div>
        );
      }
      return (
        <div>
          <h1 className="page-title">Games</h1>
          <p className="page-subtitle">Pick a lesson to play</p>
          <LessonList lessons={withMixedLesson(lessons, allWords)} onSelect={setLesson} />
        </div>
      );
    }

    function App() {
      const [vocab, setVocab] = useState(null);
      const [tab, setTab] = useState("learn");

      useEffect(() => {
        fetch("vocabulary.json").then((r) => r.json()).then(setVocab);
      }, []);

      const allWords = useMemo(() => (vocab ? vocab.lessons.flatMap((l) => l.words) : []), [vocab]);

      if (!vocab) {
        return <div className="loading">Loading…</div>;
      }

      return (
        <React.Fragment>
          <div className="main">
            {tab === "learn" ? (
              <LearnScreen lessons={vocab.lessons} allWords={allWords} />
            ) : (
              <GamesScreen lessons={vocab.lessons} allWords={allWords} />
            )}
          </div>
          <div className="tab-bar-wrap">
            <div className="tab-bar">
              <span className="tab-brand">한국어 Vocab</span>
              <button className={"tab-btn" + (tab === "learn" ? " active" : "")} onClick={() => setTab("learn")}>Learn</button>
              <button className={"tab-btn" + (tab === "games" ? " active" : "")} onClick={() => setTab("games")}>Games</button>
            </div>
          </div>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
